name: 정산내역 자동 수집

on:
  schedule:
    # 매일 한국시간 오전 8시 (UTC 23:00 전날)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 수동으로도 실행 가능 (Actions 탭에서 "Run workflow" 버튼)

jobs:
  sync-settlement:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install requests bcrypt firebase-admin

      - name: 정산내역 수집 및 반영
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_VENDOR_ID: ${{ secrets.COUPANG_VENDOR_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/fetch_and_push_settlement.py
