function autoSplitCompany(items){const cos=["주식회사 대덕R&P","주식회사 지트","삼월중량 화물","삼월중량","한국유니콤밸브","동국실업","지티에스","진성테크","한울테크","케이테크","한국신광","제일이엔에스","유한기계","디엔공작기계","경보엔지니어링","소울텍바이스","코닝정밀소재","대경툴","신용길","정밀원테크","신용정밀","화진","에이원인더스","디떠블유","형제정밀","만텍","대광지관","이봉은","머신툴","차세대기전","세일이엔지","대구화천","사하금형","대웅","대산에이피","유한자동차부품","대림eng","충무정밀","삼에스기계","전대흥","케이비오토텍","엠엠피아이","정우금속","allt","엠이엔지","건명특수기계","우리화스텍","최석진","비제이코리아","해왕","썬라이즈","성진eng","키츠코리아","효산","남양공업","동아지게차","아현전기","상록","yhb","세바","태양정밀조명","화천상공사","정보이엔지","올인테크","신일PMS","권기석","신화툴링","박성동","화물비","영주테크","길공구","세인트","안산정공","동산제닉스","디에이툴","에이치엠씨","일산공작기계","윤신재","와이에이치비클리너","위드비","툴젠","메카로","네오스펙","이종만","삼익thk","고속지게차","으뜸기술","황규확","유니언머신","디엠공작기계","대영정밀","일월중량","엠에이치머시너리","미래코리아","모산모터","다모아텍","코리아머신","태일시스템","테슬론","정기섭","세미테크","남부","윤원테크","대한기계","진명산업","성우eng","장비특수중량","목수들의세상","디엔테크","베스트","화천서비스","이양연","이명섭","박완","서동정밀","남북","통일공작기계","와이제이티","대상","컴스그린에너지","네오테크","메카로","지개차"].sort((a,b)=>b.length-a.length);return items.map(it=>{if(it.company)return it;const desc=(it.desc||'').trim();let company='',content=desc;for(const c of cos){if(desc.startsWith(c)){company=c;content=desc.slice(c.length).trim();break;}}if(!company){const p=desc.split(' ');company=p[0];content=p.slice(1).join(' ');}return{...it,company,content};});}
window.startSync=function(cb){_DOC.onSnapshot((snap)=>{if(snap.exists){const d=snap.data();cb({misugeum:autoSplitCompany(JSON.parse(d.misugeum||'[]')),jigeum:autoSplitCompany(JSON.parse(d.jigeum||'[]'))});}});};
</script>

function exportBackup(){const ARCHIVE_KEY='soogeum_archive';let archive=[];try{archive=JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'[]');}catch(e){}const backup={version:1,exportedAt:new Date().toISOString(),current:data,archive:archive};const json=JSON.stringify(backup,null,2);const encrypted=CryptoJS.AES.encrypt(json,'5143').toString();const encWrapper=JSON.stringify({encrypted:true,data:encrypted});const blob=new Blob([encWrapper],{type:'application/json'});const url=URL.createObjectURL(blob);const d=new Date();const fileName='수금대장_백업_'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';const a=document.createElement('a');a.href=url;a.download=fileName;a.click();URL.revokeObjectURL(url);const dateStr=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';const subject=encodeURIComponent('수금대장 백업 '+dateStr);const body=encodeURIComponent('수금대장 백업 파일입니다. ('+dateStr+')\n\n미수금 항목: '+(data.misugeum?data.misugeum.length:0)+'개\n지급금 항목: '+(data.jigeum?data.jigeum.length:0)+'개\n\n※ 방금 저장된 백업 파일('+fileName+')을 이 메일에 첨부해서 보내주세요.\n(파일은 다운로드 폴더에 저장됐어요)');const mailLink='mailto:mohoro@naver.com?subject='+subject+'&body='+body;setTimeout(()=>{window.location.href=mailLink;},500);toast('백업 저장 + 메일 앱 열렸어요!');}
function importBackup(event){const file=event.target.files[0];if(!file)return;if(!confirm('현재 데이터를 백업 파일로 덮어씁니다. 계속할까요?')){event.target.value='';return;}const reader=new FileReader();reader.onload=function(e){try{let parsed=JSON.parse(e.target.result);if(parsed.encrypted){const pw=prompt('백업 파일 비밀번호를 입력하세요:');if(!pw)return;try{const bytes=CryptoJS.AES.decrypt(parsed.data,pw);const decrypted=bytes.toString(CryptoJS.enc.Utf8);if(!decrypted){toast('비밀번호가 틀렸어요');return;}parsed=JSON.parse(decrypted);}catch(err){toast('비밀번호가 틀렸어요');return;}}const backup=parsed;if(!backup.current){toast('올바른 백업 파일이 아니에요');return;}data=backup.current;if(backup.archive){localStorage.setItem('soogeum_archive',JSON.stringify(backup.archive));}save();render();toast('복원 완료!');}catch(err){toast('파일을 읽을 수 없어요');}event.target.value='';};reader.readAsText(file);}
function checkYearRollover(){const ARCHIVE_KEY='soogeum_archive';const appYear=2026;const curYear=new Date().getFullYear();if(curYear<=appYear)return;let archive=[];try{archive=JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'[]');}catch(e){}const alreadyDone=archive.find(a=>a.year===appYear);if(alreadyDone)return;const totalIncome=data.misugeum.filter(it=>it.done).reduce((s,it)=>s+Number(it.amt),0);const totalExpense=data.jigeum.filter(it=>it.done).reduce((s,it)=>s+Number(it.amt),0);archive.push({year:appYear,totalIncome,totalExpense,misugeum:[...data.misugeum],jigeum:[...data.jigeum],archivedAt:new Date().toISOString()});localStorage.setItem(ARCHIVE_KEY,JSON.stringify(archive));data={misugeum:[],jigeum:[]};save();document.querySelector('.app-title').textContent='수금대장 '+curYear;toast(appYear+'년 자동 백업 완료! '+curYear+'년 장부 시작');}

function render(){const items=[...data[tab]].sort((a,b)=>{const toNum=d=>{const[m,day]=(d||'0/0').split('/');return parseInt(m)*100+parseInt(day);};const dateDiff=toNum(b.date)-toNum(a.date);if(dateDiff!==0)return dateDiff;return(b.id||0)-(a.id||0);});const getMonth=(date)=>{if(!date)return null;if(date.includes('-'))return date.slice(0,7);const parts=date.split('/');if(parts.length>=1)return parts[0].padStart(2,'0')+'월';return null;};const monthKeys=[...new Set(items.map(it=>getMonth(it.date)).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b));const mfRow=document.getElementById('monthFilterRow');if(mfRow){const allBtn='<button class="month-btn'+(monthSel==='all'?' active':'')+'" onclick="setMonthSel(\'all\')">전체</button>';const monthBtns=monthKeys.map(m=>'<button class="month-btn'+(monthSel===m?' active':'')+'" onclick="setMonthSel(\''+m+'\')">'+m+'</button>').join('');mfRow.innerHTML=allBtn+monthBtns;}const searchQ=(document.getElementById('searchBox')?.value||'').toLowerCase();const filtered=items.filter(it=>{if(filter==='done'&&!it.done)return false;if(filter==='pending'&&it.done)return false;if(filter==='taxpending'&&it.tax!=='pending')return false;if(monthSel!=='all'){const itMonth=getMonth(it.date);if(itMonth!==monthSel)return false;}if(searchQ&&!((it.company||'')+(it.content||it.desc||'')).toLowerCase().includes(searchQ))return false;return true;});const total=items.reduce((s,it)=>s+Number(it.amt),0);const pending=items.filter(it=>!it.done).reduce((s,it)=>s+Number(it.amt),0);const cl=tab==='misugeum'?'red':'green';document.getElementById('totalAmt').textContent=fmt(total);document.getElementById('pendingAmt').className='stat-val '+cl;document.getElementById('pendingAmt').textContent=fmt(pending);const el=document.getElementById('listEl');if(!filtered.length){el.innerHTML='<div class="empty">항목이 없습니다</div>';return;}const ck=tab==='misugeum'?'mis':'ji';const taxMap={issued:{cls:'issued',lbl:'계산서발행'},pending:{cls:'pending',lbl:'계산서미발행'},none:{cls:'none',lbl:'계산서없음'}};el.innerHTML=filtered.map(it=>{const ri=data[tab].findIndex(x=>x.id===it.id);const taxInfo=taxMap[it.tax]||taxMap['pending'];const paidAmt=it.splits?it.splits.reduce((s,sp)=>s+Number(sp.amt),0):0;const remainAmt=it.amt-paidAmt;const splitHtml=it.isSplit?`<div class="split-detail">${(it.splits||[]).map(sp=>`<div class="split-row"><span class="split-row-label">${sp.desc}${sp.date?' ('+sp.date+')':''}</span><span class="split-row-amt">${fmt(sp.amt)}</span></div>`).join('')}<div class="split-remain"><span>잔여금액</span><span style="color:${remainAmt<=0?'#1a8a4a':'#d63030'}">${remainAmt<=0?'✅ 완납':fmt(remainAmt)}</span></div><button class="split-add-btn" onclick="openSplitModal(${ri})">+ 입금 추가</button></div>`:'';return`<div class="item${it.done?' done':''}"><div class="check${it.done?' checked '+ck:''}" onclick="toggle(${ri})"></div><div class="item-body">${it.company?`<div class="item-company">${it.company}</div>`:""}<div class="item-desc" onclick="editDesc(${ri})" style="cursor:pointer">${it.content||it.desc}</div><div class="item-meta">${it.date?`<span class="item-date">${it.date}</span>`:''}<span class="item-amt ${cl}">${fmt(it.amt)}</span>${it.isSplit?'<span class="split-badge">분할</span>':''}<button class="tax-badge ${taxInfo.cls}" onclick="toggleTax(${ri})">${taxInfo.lbl}</button></div>${splitHtml}</div><div style="display:flex;flex-direction:column;gap:4px;align-items:center;flex-shrink:0"><button class="item-del" onclick="editDesc(${ri})" title="수정">✏️</button><button class="item-del" onclick="del(${ri})">×</button></div></div>`;}).join('');}

let editSplitOn=false;
let editSplitItems=[];
function toggleEditSplit(){
  editSplitOn=!editSplitOn;
  const btn=document.getElementById('editSplitToggle');
  const sec=document.getElementById('editSplitSection');
  if(editSplitOn){
    btn.style.background='#fff3cd';btn.style.color='#856404';btn.style.borderColor='#ffc107';btn.textContent='분할✓';
    sec.style.display='block';
    if(editSplitItems.length===0){
      const _d=new Date();const _t=(_d.getMonth()+1)+'/'+_d.getDate();
      editSplitItems=[{desc:'계약금',amt:0,date:_t}];
    }
    renderEditSplitRows();
  }else{
    btn.style.background='';btn.style.color='';btn.style.borderColor='';btn.textContent='분할';
    sec.style.display='none';
  }
}
function renderEditSplitRows(){
  const cont=document.getElementById('editSplitRows');
  cont.innerHTML='';
  editSplitItems.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='edit-split-item';
    div.innerHTML=`<input type="text" value="${s.desc}" placeholder="항목명" style="flex:3" oninput="editSplitItems[${i}].desc=this.value"/>
      <input type="text" value="${s.date}" placeholder="날짜" style="flex:2" oninput="editSplitItems[${i}].date=this.value"/>
      <input type="text" inputmode="numeric" value="${s.amt?Number(s.amt).toLocaleString('ko-KR'):''}" placeholder="금액" style="flex:3" oninput="formatSplitAmt(this,${i})"/>
      <button onclick="removeEditSplitRow(${i})" style="background:transparent;border:none;cursor:pointer;color:#aaa;font-size:16px;flex-shrink:0">✕</button>`;
    cont.appendChild(div);
  });
  updateEditSplitTotal();
}
function formatSplitAmt(el,i){
  const raw=el.value.replace(/,/g,'').replace(/[^0-9]/g,'');
  const num=Number(raw)||0;
  editSplitItems[i].amt=num;
  const pos=el.selectionStart;const prevLen=el.value.length;
  el.value=num?num.toLocaleString('ko-KR'):'';
  el.selectionStart=el.selectionEnd=pos+(el.value.length-prevLen);
  updateEditSplitTotal();
}
function addEditSplitRow(){
  const _d=new Date();const _t=(_d.getMonth()+1)+'/'+_d.getDate();
  const totalAmt=Number(document.getElementById('editAmtInp').value.replace(/,/g,''))||0;
  const sumSoFar=editSplitItems.reduce((a,s)=>a+Number(s.amt),0);
  const remain=totalAmt-sumSoFar;
  editSplitItems.push({desc:'',amt:remain>0?remain:0,date:_t});
  renderEditSplitRows();
}
function removeEditSplitRow(i){editSplitItems.splice(i,1);renderEditSplitRows();}
function updateEditSplitTotal(){
  const sum=editSplitItems.reduce((a,s)=>a+Number(s.amt),0);
  const totalAmt=Number(document.getElementById('editAmtInp').value.replace(/,/g,''))||0;
  const el=document.getElementById('editSplitTotal');
  el.textContent=sum.toLocaleString('ko-KR')+'원';
  el.style.color=sum===totalAmt?'#1a8a4a':sum>totalAmt?'#d63030':'var(--text)';
}

// ===== 정산 가져오기 =====
let settlePending = [];
const SETTLE_KEY = 'soogeum_settle_meta';

function getSettleMeta(){
  try { return JSON.parse(localStorage.getItem(SETTLE_KEY)||'{}'); } catch(e){ return {}; }
}
function saveSettleMeta(meta){
  localStorage.setItem(SETTLE_KEY, JSON.stringify(meta));
}

function openSettlePopup(){
  // 마지막 업로드 날짜 표시
  const meta = getSettleMeta();
  const naverEl = document.getElementById('naverLastUpload');
  const coupangEl = document.getElementById('coupangLastUpload');
  if(naverEl) naverEl.textContent = meta.naver ? '마지막 업로드: ' + meta.naver : '아직 업로드 없음';
  if(coupangEl) coupangEl.textContent = meta.coupang ? '마지막 업로드: ' + meta.coupang : '아직 업로드 없음';
  document.getElementById('settlePopup').classList.remove('hidden');
}
function closeSettlePopup(){
  document.getElementById('settlePopup').classList.add('hidden');
}
function closeSettlePreview(){
  document.getElementById('settlePreview').classList.add('hidden');
  settlePending = [];
}

// 여러 파일 읽기 (Promise)
function readXlsxFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e){
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws, {defval:''}));
      } catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

async function importSettle(event, platform){
  closeSettlePopup();
  const files = Array.from(event.target.files);
  event.target.value = '';
  if(!files.length) return;

  const curYear = new Date().getFullYear();
  const prefix = platform === 'naver' ? '[네이버]' : '[쿠팡]';

  // 기존 등록된 주문번호 (중복방지)
  const existingNos = new Set(
    data.misugeum
      .filter(it => it.naverOrderNo)
      .map(it => it.naverOrderNo)
  );

  const toAdd = [];
  let skippedDup = 0;
  let skippedEtc = 0;

  try {
    if(platform === 'naver'){
      // ===== 네이버 파싱 =====
      for(const file of files){
        const rows = await readXlsxFile(file);
        rows.forEach(row => {
          const orderNo = String(row['상품주문번호'] || '').trim();
          if(!orderNo) return;

          // 정산완료일 없으면 스킵
          const completedDate = String(row['정산완료일'] || '').trim();
          if(!completedDate){ skippedEtc++; return; }

          // 현재 연도 정산분만
          if(!completedDate.startsWith(String(curYear))){ skippedEtc++; return; }

          // 금액 계산
          const base = Number(row['정산기준금액(A)'] || 0);
          const npay = Number(row['Npay 수수료(B)'] || 0);
          const sales = Number(row['매출연동 수수료 합계(C)'] || 0);
          const amt = base + npay + sales;
          if(amt <= 0){ skippedEtc++; return; }

          // 중복 체크
          if(existingNos.has(orderNo)){ skippedDup++; return; }
          existingNos.add(orderNo); // 같은 배치 내 중복도 방지

          // 날짜 파싱 (2026.01.06 → 1/6)
          const parts = completedDate.replace(/\./g, '-').split('-');
          const dateStr = parseInt(parts[1]) + '/' + parseInt(parts[2]);

          const name = String(row['구매자명'] || '').trim();
          const product = String(row['상품명'] || '스마트스토어 정산').trim();
          const shortProduct = product.length > 25 ? product.slice(0, 25) + '…' : product;

          toAdd.push({ orderNo, name, dateStr, amt, product: shortProduct, platform });
        });
      }

    } else if(platform === 'coupang'){
      // ===== 쿠팡 파싱 =====
      // 주문번호(0번컬럼) 기준으로 파일별 합산 후 중복제거
      const fileOrderMap = {}; // orderNo -> {name, amt, date, product}

      for(const file of files){
        const rows = await readXlsxFile(file);
        const fileOrders = {};

        rows.forEach(row => {
          // 쿠팡은 헤더가 한글 컬럼명
          const orderNo = String(row['주문번호'] || '').split('.')[0].trim();
          if(!orderNo || orderNo === 'None' || orderNo === '') return;

          const settleDate = String(row['정산예정일'] || '').trim();
          // 현재 연도 정산분만
          if(!settleDate.startsWith(String(curYear))){ return; }

          const sale = Number(row['판매액'] || 0);         // 판매액 소계
          const fee = Number(row['판매수수료'] || 0);       // 판매수수료
          const settleAmt = sale - Math.abs(fee);          // 정산대상액 = 판매액 - 수수료
          const name = String(row['구매자명'] || '').trim();
          const product = String(row['상품명'] || '').replace(/^"|"$/g,'').trim();

          if(!fileOrders[orderNo]){
            fileOrders[orderNo] = { name:'', amt:0, date:settleDate, product:'' };
          }
          fileOrders[orderNo].amt += settleAmt;
          if(name && !fileOrders[orderNo].name) fileOrders[orderNo].name = name;
          if(product && !fileOrders[orderNo].product) fileOrders[orderNo].product = product;
        });

        // 파일별 주문을 전체 맵에 머지 (파일간 중복은 첫 번째 파일 우선)
        Object.entries(fileOrders).forEach(([no, v]) => {
          if(!fileOrderMap[no]){
            fileOrderMap[no] = v;
          } else {
            // 같은 주문이 다른 파일에도 있으면 금액 합산하지 않고 스킵
          }
        });
      }

      // fileOrderMap → toAdd
      Object.entries(fileOrderMap).forEach(([orderNo, v]) => {
        if(v.amt <= 0){ skippedEtc++; return; }
        if(existingNos.has(orderNo)){ skippedDup++; return; }
        existingNos.add(orderNo);

        const parts = v.date.split('-');
        const dateStr = parseInt(parts[1]) + '/' + parseInt(parts[2]);
        const shortProduct = v.product.length > 25 ? v.product.slice(0,25) + '…' : v.product;

        toAdd.push({ orderNo, name: v.name, dateStr, amt: Math.round(v.amt), product: shortProduct, platform });
      });
    }

    if(toAdd.length === 0){
      // 추가할 게 없어도 날짜는 저장
      const meta2 = getSettleMeta();
      const today2 = new Date();
      meta2[platform] = today2.getFullYear() + '년 ' + (today2.getMonth()+1) + '월 ' + today2.getDate() + '일까지';
      saveSettleMeta(meta2);
      let msg = '추가할 새 항목이 없어요.';
      if(skippedDup > 0) msg += ' (' + skippedDup + '건 이미 등록됨)';
      if(skippedEtc > 0) msg += ' (' + skippedEtc + '건 미완료/해당연도외)';
      toast(msg);
      return;
    }

    // 날짜순 정렬
    toAdd.sort((a, b) => {
      const [am, ad] = a.dateStr.split('/').map(Number);
      const [bm, bd] = b.dateStr.split('/').map(Number);
      return (am*100+ad) - (bm*100+bd);
    });

    // 파일에서 읽은 가장 최근 정산일을 마지막 업로드로 저장 (추가 여부와 무관)
    {
      const allItems = [...toAdd];
      // 중복 스킵된 것들도 포함해서 파일 자체의 최신 날짜를 저장해야 하므로
      // toAdd가 없어도 파일을 올린 사실 자체를 기록
      const meta = getSettleMeta();
      const curYear2 = new Date().getFullYear();
      const today = new Date();
      const todayStr = curYear2 + '년 ' + (today.getMonth()+1) + '월 ' + today.getDate() + '일까지';
      meta[platform] = todayStr;
      saveSettleMeta(meta);
    }

    // 미리보기 팝업
    settlePending = toAdd;
    const skipMsg = (skippedDup > 0 ? ' · 중복 ' + skippedDup + '건 스킵' : '') +
                    (skippedEtc > 0 ? ' · 제외 ' + skippedEtc + '건' : '');
    document.getElementById('settlePreviewTitle').textContent = prefix + ' 총 ' + toAdd.length + '건 추가 예정';
    document.getElementById('settlePreviewSub').textContent = '확인 후 추가하기를 눌러주세요.' + skipMsg;

    const listEl = document.getElementById('settlePreviewList');
    listEl.innerHTML = toAdd.map(r =>
      '<div class="settle-preview-item">' +
        '<div>' +
          '<div class="settle-preview-name">' + prefix + ' ' + r.name + '</div>' +
          '<div class="settle-preview-date">' + r.dateStr + ' · ' + r.product + '</div>' +
        '</div>' +
        '<div class="settle-preview-amt">' + r.amt.toLocaleString('ko-KR') + '원</div>' +
      '</div>'
    ).join('');

    document.getElementById('settlePreview').classList.remove('hidden');

  } catch(err){
    console.error(err);
    toast('파일을 읽을 수 없어요. 올바른 정산 파일인지 확인해주세요.');
  }
}

function confirmSettle(){
  if(!settlePending.length) return;
  const prefix = settlePending[0].platform === 'naver' ? '[네이버]' : '[쿠팡]';
  const orderField = settlePending[0].platform === 'naver' ? 'naverOrderNo' : 'naverOrderNo';

  // 마지막 정산일 계산 (가장 최근 날짜)
  let maxMonth = 0, maxDay = 0;
  settlePending.forEach(r => {
    const [m, d] = r.dateStr.split('/').map(Number);
    if(m*100+d > maxMonth*100+maxDay){ maxMonth=m; maxDay=d; }
  });

  settlePending.forEach(r => {
    data.misugeum.unshift({
      desc: prefix + ' ' + r.name + ' ' + r.product,
      company: prefix + ' ' + r.name,
      content: r.product,
      amt: r.amt,
      date: r.dateStr,
      done: true,
      tax: 'issued',
      isSplit: false,
      splits: [],
      naverOrderNo: r.orderNo,
      id: Date.now() + Math.random()
    });
  });

  // 마지막 업로드 날짜 저장
  const curYear = new Date().getFullYear();
  const meta = getSettleMeta();
  const platform = settlePending[0].platform;
  meta[platform] = curYear + '년 ' + maxMonth + '월 ' + maxDay + '일까지';
  saveSettleMeta(meta);

  save();
  render();
  closeSettlePreview();
  toast('✅ ' + settlePending.length + '건 추가됐어요!');
  settlePending = [];
}
