<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>품목 수정 - 분할</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 2rem 1rem; }

    .card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; padding: 1rem 1.25rem; max-width: 600px; margin: 0 auto; }
    .badge { font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 20px; display: inline-block; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: flex-start; justify-content: center; padding: 2rem 1rem; z-index: 100; overflow-y: auto; }
    .overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 440px; margin-top: 1rem; }

    .inp { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; background: #f9f9f9; color: #111; }
    .inp:focus { outline: none; border-color: #C8981A; }

    .btn-cancel { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; background: #f5f5f5; color: #666; font-size: 15px; cursor: pointer; }
    .btn-confirm { flex: 2; padding: 12px; border-radius: 8px; border: none; background: #C8981A; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; }

    .split-row-card { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .add-dashed { width: 100%; margin-top: 8px; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; background: transparent; color: #999; font-size: 13px; cursor: pointer; }

    /* 분할 토글 */
    .toggle-wrap { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .toggle { width: 42px; height: 24px; border-radius: 12px; background: #ddd; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; border: none; }
    .toggle.on { background: #C8981A; }
    .toggle::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left 0.2s; }
    .toggle.on::after { left: 21px; }

    .split-item-row { display: flex; gap: 6px; align-items: center; }
    .split-inp { padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; background: #f9f9f9; color: #111; }
    .split-inp:focus { outline: none; border-color: #C8981A; }
  </style>
</head>
<body>

<!-- 카드 -->
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div style="flex:1;">
      <div style="font-size:14px;font-weight:500;color:#111;margin-bottom:2px;" id="vName">문테크</div>
      <div style="font-size:12px;color:#888;margin-bottom:6px;" id="vDesc">MYNX-750 2007년식 / 파워바이스4대 / BT50공구 3개</div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span style="font-size:12px;color:#888;">5/13</span>
        <span style="font-size:14px;font-weight:500;color:#C8981A;" id="vPrice">37,400,000원</span>
        <span class="badge" style="background:#C8981A;color:#fff;display:none;" id="splitBadge">분할</span>
      </div>
    </div>
    <button onclick="openModal()" style="background:transparent;border:none;cursor:pointer;color:#C8981A;padding:4px;font-size:18px;" aria-label="수정">✏️</button>
  </div>
  <!-- 분할 항목 (분할 켜졌을 때만 보임) -->
  <div id="cardSplitArea" style="display:none;margin-top:10px;"></div>
</div>

<!-- 수정 모달 -->
<div id="modal" class="overlay">
  <div class="modal">
    <div style="font-size:16px;font-weight:500;color:#111;margin-bottom:1.25rem;">내용 수정</div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <input class="inp" id="mName" type="text" value="문테크" />
      <input class="inp" id="mDesc" type="text" value="MYNX-750 2007년식 / 파워바이스4대 / BT50공구 3개" />
      <input class="inp" id="mPrice" type="text" value="37,400,000" />
    </div>

    <!-- 분할 토글 -->
    <div style="border-top:1px solid #f0f0f0;margin-top:1.25rem;padding-top:1rem;">
      <div class="toggle-wrap">
        <div>
          <div style="font-size:14px;font-weight:500;color:#111;">분할</div>
          <div style="font-size:12px;color:#888;margin-top:2px;">입금을 여러 건으로 나눠서 관리</div>
        </div>
        <button class="toggle" id="splitToggle" onclick="toggleSplit()" aria-label="분할 토글"></button>
      </div>

      <!-- 분할 항목 입력 (토글 ON일 때만 보임) -->
      <div id="splitSection" style="display:none;margin-top:10px;">
        <div id="mSplitRows" style="display:flex;flex-direction:column;gap:8px;"></div>
        <button onclick="addRow()" class="add-dashed">+ 항목 추가</button>
        <div style="display:flex;justify-content:space-between;margin-top:10px;padding:8px 12px;border-radius:8px;background:#f9f9f9;">
          <span style="font-size:13px;color:#888;">합계</span>
          <span style="font-size:13px;font-weight:500;" id="mTotal">0원</span>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:1.25rem;">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-confirm" onclick="save()">수정</button>
    </div>
  </div>
</div>

<script>
  let TOTAL = 37400000;
  let splitOn = false;
  let splits = [];

  function fmt(n) { return Math.round(n).toLocaleString(); }
  function parseNum(s) { return parseInt((s + '').replace(/[^0-9]/g, '')) || 0; }

  function openModal() {
    document.getElementById('mName').value = document.getElementById('vName').textContent;
    document.getElementById('mDesc').value = document.getElementById('vDesc').textContent;
    document.getElementById('mPrice').value = fmt(TOTAL);
    renderModalRows();
    document.getElementById('modal').classList.add('open');
  }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  function toggleSplit() {
    splitOn = !splitOn;
    const btn = document.getElementById('splitToggle');
    const sec = document.getElementById('splitSection');
    btn.classList.toggle('on', splitOn);
    sec.style.display = splitOn ? 'block' : 'none';
    if (splitOn && splits.length === 0) {
      splits.push({ label: '계약금', date: '', amount: 0 });
      splits.push({ label: '잔금', date: '', amount: 0 });
      renderModalRows();
    }
  }

  function renderModalRows() {
    const cont = document.getElementById('mSplitRows');
    cont.innerHTML = '';
    splits.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'split-item-row';
      div.innerHTML = `
        <input class="split-inp" type="text" value="${s.label}" placeholder="항목명" style="flex:2;" oninput="splits[${i}].label=this.value" />
        <input class="split-inp" type="text" value="${s.date}" placeholder="날짜" style="flex:1.2;" oninput="splits[${i}].date=this.value" />
        <input class="split-inp" type="text" value="${s.amount ? fmt(s.amount) : ''}" placeholder="금액" style="flex:2;" oninput="splits[${i}].amount=parseNum(this.value);updateTotal()" />
        <button onclick="removeRow(${i})" style="background:transparent;border:none;cursor:pointer;color:#999;font-size:16px;padding:4px;">✕</button>
      `;
      cont.appendChild(div);
    });
    updateTotal();
  }

  function addRow() {
    splits.push({ label: '', date: '', amount: 0 });
    renderModalRows();
  }
  function removeRow(i) {
    splits.splice(i, 1);
    renderModalRows();
  }
  function updateTotal() {
    const sum = splits.reduce((a, s) => a + s.amount, 0);
    const el = document.getElementById('mTotal');
    el.textContent = fmt(sum) + '원';
    el.style.color = sum === TOTAL ? '#2C9E6E' : sum > TOTAL ? '#E24B4A' : '#111';
  }

  function save() {
    document.getElementById('vName').textContent = document.getElementById('mName').value;
    document.getElementById('vDesc').textContent = document.getElementById('mDesc').value;
    TOTAL = parseNum(document.getElementById('mPrice').value);
    document.getElementById('vPrice').textContent = fmt(TOTAL) + '원';

    // 분할 배지
    document.getElementById('splitBadge').style.display = splitOn ? 'inline-block' : 'none';

    // 카드에 분할 항목 표시
    const area = document.getElementById('cardSplitArea');
    if (splitOn && splits.length > 0) {
      area.style.display = 'block';
      let html = '';
      splits.forEach(s => {
        html += `<div class="split-row-card">
          <input type="radio" name="r" style="accent-color:#C8981A;width:16px;height:16px;flex-shrink:0;" />
          <span style="flex:1;font-size:13px;color:#888;">${s.label}${s.date ? ' (' + s.date + ')' : ''}</span>
          <span style="font-size:13px;font-weight:500;color:#C8981A;">${fmt(s.amount)}원</span>
        </div>`;
      });
      const paid = splits.reduce((a, s) => a + s.amount, 0);
      const rem = TOTAL - paid;
      html += `<div style="display:flex;justify-content:space-between;padding:10px 0 0;">
        <span style="font-size:13px;font-weight:500;color:#111;">잔여금액</span>
        <span style="font-size:13px;font-weight:500;color:${rem <= 0 ? '#2C9E6E' : '#E24B4A'};">${fmt(rem)}원</span>
      </div>`;
      area.innerHTML = html;
    } else {
      area.style.display = 'none';
      area.innerHTML = '';
    }

    closeModal();
  }
</script>
</body>
</html>
